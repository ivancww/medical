name: Deploy Medical to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Medical
        uses: actions/checkout@v4

      - name: Validate /medical/ deployment contract
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          html = Path("index.html").read_text()
          app = Path("app.js").read_text()
          service_worker = Path("sw.js").read_text()
          manifest = json.loads(Path("manifest.json").read_text())
          release = json.loads(Path("release-version.json").read_text())

          assert manifest["start_url"] == "/medical/"
          assert manifest["scope"] == "/medical/"
          assert manifest["display"] == "standalone"
          assert release["appVersion"] == "v1.1.7"
          assert 'href="manifest.json"' in html
          assert "claim-engine.js" in html and "app.js" in html
          assert "medical-official-sync.js" in html
          assert "app-build.js" in html
          assert 'href="styles.css"' in html
          assert "serviceWorker.register('sw.js',{scope:'./',updateViaCache:'none'})" in app
          assert "./index.html" in service_worker
          assert "./manifest.json" in service_worker
          assert "./app.js" in service_worker
          assert "./app-build.js" in service_worker
          assert "./release-version.json" in service_worker
          assert "./medical-admin-auth.js" in service_worker
          assert "./claim-engine.js" in service_worker
          assert "./styles.css" in service_worker
          assert "medical-admin-auth.js" in html
          assert "medical-official-sync.js" in service_worker
          assert "ava-admin-connector.mjs" in service_worker
          assert "medical-official-sync.js?v=1.1.7" in html
          assert "app.js?v=1.1.7" in html
          assert not re.search(r'(?:href|src)=["\']/[^/]', html)
          print("Medical /medical/ deployment contract PASS")
          PY

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Medical
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble Medical site
        run: |
          mkdir -p _site
          cp index.html app.js medical-admin-auth.js medical-official-sync.js ava-admin-connector.mjs claim-engine.js styles.css ready-product.css product-data.js app-build.js release-version.json manifest.json sw.js _site/
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          version = json.loads(Path("release-version.json").read_text())["appVersion"]
          Path("_site/app-build.js").write_text(
              f"window.AVA_MEDICAL_VERSION = {version!r};\n"
              f"window.AVA_MEDICAL_BUILD = {os.environ['GITHUB_SHA']!r};\n"
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
